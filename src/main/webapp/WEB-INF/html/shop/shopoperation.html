<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Shop Information | Urban Life</title>
	<meta name="description"
		  content="Edit shop information.">
	<meta name="author" content="阿里巴巴国际UED前端">
	<meta name="viewport" content="initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="format-detection" content="telephone=no">
	<!-- Google Web Fonts -->
	<link rel="stylesheet"
		  href="../resources/css/common/sm.min.css">
	<link rel="stylesheet"
		  href="../resources/css/common/sm-extend.min.css">
	<link rel="apple-touch-icon-precomposed"
		  href="/assets/img/apple-touch-icon-114x114.png">
    <link rel="stylesheet" href="../resources/css/common/communityapp-modern.css?v=4">
</head>
<body>
<div class="page-group">
	<div id="page-label-input" class="page">
		<header class="bar bar-nav">
<a class="ca-admin-back" external href="/communityApp/shopadmin/shopmanagement">Back to Shop Management</a>
			<h1 class="title">Shop Information</h1>
		</header>
		<div class="content">
			<div class="list-block">
				<ul>
					<!-- Text inputs -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Shop Name</div>
								<div class="item-input">
									<input type="text" id="shop-name" placeholder="shop name">
								</div>
							</div>
						</div>
					</li>
					<!-- 商铺分类 下拉列表 -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Shop Category</div>
								<div class="item-input">
									<select id="shop-category">
									</select>
								</div>
							</div>
						</div>
					</li>
					<!-- 区域分类 下拉列表 -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Area</div>
								<div class="item-input">
									<select id="area">
									</select>
								</div>
							</div>
						</div>
					</li>
					<!-- 详细地址 text -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Address</div>
								<div class="item-input">
									<input type="text" id="shop-addr" placeholder="addr">
								</div>
							</div>
						</div>
					</li>
					<!-- 联系电话 text -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Phone</div>
								<div class="item-input">
									<input type="text" id="shop-phone" placeholder="phone">
								</div>
							</div>
						</div>
					</li>
					<!-- 缩略图 上传控件 -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Shop Image</div>
								<div class="item-input">
									<input type="file" id="shop-img">
								</div>
							</div>
						</div>
					</li>
					<!-- 店铺简介 textarea -->
					<li class="align-top">
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Shop Description</div>
								<div class="item-input">
									<textarea id="shop-desc" placeholder="shop desc"></textarea>
								</div>
							</div>
						</div>
					</li>
					<!-- 验证码 ka -->
					<li>
						<div class="item-content">
							<div class="item-inner">
								<div class="item-title label">Captcha</div>
								<input type="text" id="j_captcha" placeholder="captcha">
								<div class="item-input">
									<img id="captcha_img" alt="update" title="update"
										 onclick="changeVerifyCode(this)" src="../Kaptcha" />
								</div>
							</div>
						</div>
					</li>
				</ul>
			</div>
			<div class="content-block">
				<div class="row">
					<div class="col-50">
						<a href="/communityApp/shopadmin/shopmanagement" class="button button-big button-fill button-danger">Cancel</a>
					</div>
					<div class="col-50">
						<a href="#" class="button button-big button-fill button-success"
						   id="submit">Save Shop</a>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script type='text/javascript'
		src='../resources/js/common/zepto.min.js' charset='utf-8'></script>
<script type='text/javascript'
		src='../resources/js/common/sm.min.js' charset='utf-8'></script>
<script type='text/javascript'
		src='../resources/js/common/sm-extend.min.js' charset='utf-8'></script>
<script type='text/javascript' src='../resources/js/common/common.js'
		charset='utf-8'></script>
<script type='text/javascript'
		src='../resources/js/shop/shopoperation.js' charset='utf-8'></script>
</body>
</html>
