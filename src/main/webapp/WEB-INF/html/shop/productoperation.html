<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>product edit</title>
    <meta name="viewport" content="initial-scale=1, maximum-scale=1">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet"
          href="../resources/css/common/sm.min.css">
    <link rel="stylesheet"
          href="../resources/css/common/sm-extend.min.css">
    <link rel="stylesheet"
          href="../resources/css/shop/productmanagement.css">
    <link rel="stylesheet" href="../resources/css/common/communityapp-modern.css?v=4">
</head>
<body>
<header class="bar bar-nav">
<a class="ca-admin-back" external href="/communityApp/shopadmin/productmanagement">Back to Products</a>
    <h1 class="title">Product Edit</h1>
</header>
<div class="content">
    <div class="ca-form-section-title">Basic Information</div>
    <div class="list-block ca-edit-form">
        <ul>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-name"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Product Name</div>
                        <div class="item-input">
                            <input type="text" id="product-name" placeholder="product name">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Category</div>
                        <div class="item-input">
                            <select id="category">
                            </select>
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Priority</div>
                        <div class="item-input">
                            <input type="number" id="priority">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Reward Points</div>
                        <div class="item-input">
                            <input type="number" id="point">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Price</div>
                        <div class="item-input">
                            <input type="number" id="normal-price">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Promotion Price</div>
                        <div class="item-input">
                            <input type="number" id="promotion-price">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Product Image</div>
                        <div class="item-input">
                            <input type="file" id="small-img" accept="image/*">
                            <div class="ca-current-image" id="ca-existing-product-image" hidden><span>Current image</span><img id="ca-product-image-preview" alt="Current product image"></div>
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner detail-img-div">
                        <div class="item-title label">Detail Images</div>
                        <div class="item-input" id="detail-img">
                            <input type="file" class="detail-img">
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <div class="item-title label">Product Description</div>
                        <div class="item-input">
                            <textarea id="product-desc"></textarea>
                        </div>
                    </div>
                </div>
            </li>
            <li>
                <div class="item-content">
                    <div class="item-media">
                        <i class="icon icon-form-email"></i>
                    </div>
                    <div class="item-inner">
                        <label for="j_captcha" class="item-title label">captcha</label> <input
                            id="j_captcha" name="j_captcha" type="text"
                            class="form-control in" />
                        <div class="item-input">
                            <img id="captcha_img" alt="change" title="change"
                                 onclick="changeVerifyCode(this)" src="../Kaptcha" />
                        </div>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="content-block">
        <div class="row">
            <div class="col-50">
                <a href="/communityApp/shopadmin/productmanagement"
                   class="button button-big button-fill button-danger" id="back">Cancel</a>
            </div>
            <div class="col-50">
                <a href="#" class="button button-big button-fill" id="submit">Save Product</a>
            </div>
        </div>
    </div>
</div>
<script type='text/javascript'
        src='../resources/js/common/zepto.min.js' charset='utf-8'></script>
<script type='text/javascript'
        src='../resources/js/common/sm.min.js' charset='utf-8'></script>
<script type='text/javascript'
        src='../resources/js/common/sm-extend.min.js' charset='utf-8'></script>
<script type='text/javascript' src='../resources/js/common/common.js'
        charset='utf-8'></script>
<script type='text/javascript'
        src='../resources/js/shop/productoperation.js?v=4' charset='utf-8'></script>
</body>
</html>
